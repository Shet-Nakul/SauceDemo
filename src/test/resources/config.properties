# ─────────────────────────────────────────
#  SauceDemo Selenium Test Configuration
# ─────────────────────────────────────────

# Application URL
base.url=https://www.saucedemo.com/

# Browser: chrome | firefox | edge
browser=chrome

# Run in headless mode: true | false
headless=false

# ─── Credentials ───────────────────────
# Standard valid user
valid.username=standard_user
valid.password=secret_sauce

# Locked out user (for negative test)
locked.username=locked_out_user

# Invalid password for negative tests
invalid.password=wrong_password_123

# ─── Wait Timeouts (seconds) ───────────
implicit.wait=10
explicit.wait=15
